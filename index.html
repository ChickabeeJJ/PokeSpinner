        <style>
            body {
                font-family: 'Outfit', sans-serif;
                background-color: #05070f;
                color: #f3f4f6;
                overflow-x: hidden;
            }
            .heading-font {
                font-family: 'Space Grotesk', sans-serif;
            }
            /* Custom Glowing Effects */
            .glow-common { box-shadow: 0 0 15px rgba(156, 163, 175, 0.15); }
            .glow-rare { box-shadow: 0 0 15px rgba(59, 130, 246, 0.35); }
            .glow-epic { box-shadow: 0 0 20px rgba(168, 85, 247, 0.45); }
            .glow-legendary { box-shadow: 0 0 25px rgba(234, 179, 8, 0.65); animation: goldPulse 2s infinite; }
            .glow-shiny { box-shadow: 0 0 30px rgba(236, 72, 153, 0.75); animation: pinkPulse 2s infinite; }
            .glow-legendary-special { box-shadow: 0 0 40px rgba(234, 179, 8, 0.9), 0 0 80px rgba(255, 215, 0, 0.6); animation: legendaryAura 1.5s infinite; }

            @keyframes goldPulse {
                0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
                50% { box-shadow: 0 0 25px rgba(234, 179, 8, 0.85); }
            }
            @keyframes pinkPulse {
                0%, 100% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.4); }
                50% { box-shadow: 0 0 25px rgba(236, 72, 153, 0.85); }
            }
            @keyframes legendaryAura {
                0%, 100% { 
                    box-shadow: 0 0 40px rgba(234, 179, 8, 0.9), 0 0 80px rgba(255, 215, 0, 0.6), 0 0 120px rgba(255, 255, 255, 0.3);
                    transform: scale(1);
                }
                50% { 
                    box-shadow: 0 0 60px rgba(234, 179, 8, 1), 0 0 100px rgba(255, 215, 0, 0.8), 0 0 150px rgba(255, 255, 255, 0.5);
                    transform: scale(1.05);
                }
            }
            @keyframes legendaryEntry {
                0% { 
                    opacity: 0;
                    transform: scale(0.5) rotate(-180deg);
                    filter: brightness(0);
                }
                50% {
                    opacity: 0.8;
                    transform: scale(1.2) rotate(10deg);
                    filter: brightness(1.5);
                }
                100% { 
                    opacity: 1;
                    transform: scale(1) rotate(0deg);
                    filter: brightness(1);
                }
            }
            .legendary-entry-animation {
                animation: legendaryEntry 1.5s ease-out forwards;
            }

            /* Scanline Overlay for Retro Radar Vibe */
            .scanlines {
                position: fixed;
                top: 0; left: 0; width: 100%; height: 100%;
                background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.015), rgba(0, 255, 0, 0.008), rgba(0, 0, 255, 0.015));
                background-size: 100% 4px, 6px 100%;
                z-index: 999;
                pointer-events: none;
                opacity: 0.15;
            }

            /* Loading Spinner */
            .spinner {
                border: 4px solid rgba(255, 255, 255, 0.1);
                width: 36px;
                height: 36px;
                border-radius: 50%;
                border-left-color: #f43f5e;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            /* Hide Scrollbars */
            ::-webkit-scrollbar {
                width: 6px;
            }
            ::-webkit-scrollbar-track {
                background: #090e1a;
            }
            ::-webkit-scrollbar-thumb {
                background: #1e293b;
                border-radius: 4px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #334155;
            }
            /* ===== REAL POKÉBALL STYLES ===== */
            .pokeball-svg { display:flex; align-items:center; justify-content:center; }
            .pokeball-svg svg { filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5)); transition:transform 0.15s ease; }
            .ball-selector-btn:hover .pokeball-svg svg, .ball-selector-btn.active .pokeball-svg svg { transform:scale(1.12) rotate(-12deg); }

            /* ===== LIGHT MODE ===== */
            /* ═══ COMPREHENSIVE LIGHT MODE ═══════════════════════════════════════════ */
            body.light-mode { background-color:#f0f4f8!important; color:#0f172a!important; }
            body.light-mode .scanlines { opacity:0.02!important; }

            /* Structural surfaces */

            body.light-mode footer { background-color:#f8fafc!important; border-color:#dde3ef!important; }
            body.light-mode nav.sticky { background-color:#f0f4f8!important; border-color:#dde3ef!important; }

            /* All dark bg utilities */
            body.light-mode .bg-slate-950, body.light-mode [class="bg-slate-950"] { background-color:#ffffff!important; }
            body.light-mode .bg-slate-900  { background-color:#f1f5f9!important; }
            body.light-mode .bg-slate-800  { background-color:#e2e8f0!important; }
            body.light-mode .bg-slate-700  { background-color:#cbd5e1!important; }
            body.light-mode [class*="bg-slate-950\/"]{ background-color:rgba(255,255,255,0.95)!important; }
            body.light-mode [class*="bg-slate-900\/"]{ background-color:rgba(241,245,249,0.90)!important; }
            body.light-mode [class*="bg-slate-955"]   { background-color:rgba(255,255,255,0.97)!important; }
            body.light-mode [class*="bg-black\/"]    { background-color:rgba(200,210,225,0.60)!important; }

            /* Gradient backgrounds → soft light gradients */
            body.light-mode [class*="from-slate-950"],[class*="from-slate-900"],[class*="from-black"] { --tw-gradient-from:#f1f5f9!important; }
            body.light-mode [class*="to-slate-950"],[class*="to-slate-900"],[class*="to-black"]     { --tw-gradient-to:#e2e8f0!important; }
            body.light-mode [class*="via-slate-950"],[class*="via-slate-900"]                       { --tw-gradient-via:#f8fafc!important; }

            /* All text colours */
            body.light-mode .text-white    { color:#0f172a!important; }
            body.light-mode .text-slate-100{ color:#1e293b!important; }
            body.light-mode .text-slate-200{ color:#1e293b!important; }
            body.light-mode .text-slate-300{ color:#334155!important; }

            body.light-mode .text-slate-500{ color:#64748b!important; }

            /* Borders */

            body.light-mode [class*="border-white\/"]{ border-color:rgba(148,163,184,0.4)!important; }

            /* Form elements */
            body.light-mode input, body.light-mode select, body.light-mode textarea {
                background-color:#ffffff!important; color:#0f172a!important;
                border-color:#cbd5e1!important; }

            /* Specific panels */

            /* Modals */
            body.light-mode #settingsModal > div,

            /* Cards and panels */
            body.light-mode .rounded-3xl, body.light-mode .rounded-2xl { border-color:#e2e8f0!important; }
            body.light-mode [style*="background:linear-gradient"][style*="#0d1220"],

            body.light-mode [style*="border:3px solid rgba(255,255,255,0.12)"] { border-color:rgba(148,163,184,0.5)!important; }

            /* Scrollbar */

            /* PC grid cards */
            body.light-mode #pcGrid > div { background-color:#ffffff!important; border-color:#e2e8f0!important; }

            body.light-mode #profileUsernameInput::placeholder { color:#94a3b8!important; }

            /* ===== RARE ENCOUNTER CUTSCENE — ELITE EDITION ===== */

                position:fixed; inset:0; z-index:9999;

            }
            #rareCutscene.hidden { opacity:0; pointer-events:none; }
            @keyframes cutsceneScale {
                0% { transform:scale(0.2) rotate(-15deg); opacity:0; }

                80% { transform:scale(0.95) rotate(-1deg); }
                100% { transform:scale(1) rotate(0deg); }
            }
            @keyframes cutsceneGlow {
                0%,100% { filter:drop-shadow(0 0 22px rgba(255,200,50,0.75)); }
                50% { filter:drop-shadow(0 0 70px rgba(255,200,50,1)) brightness(1.15); }
            }
