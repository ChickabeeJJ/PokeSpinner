    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #05070f;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .heading-font {
            font-family: 'Space Grotesk', sans-serif;
        }
        /* Custom Glowing Effects */
        .glow-common { box-shadow: 0 0 15px rgba(156, 163, 175, 0.15); }
        .glow-rare { box-shadow: 0 0 15px rgba(59, 130, 246, 0.35); }
        .glow-epic { box-shadow: 0 0 20px rgba(168, 85, 247, 0.45); }
        .glow-legendary { box-shadow: 0 0 25px rgba(234, 179, 8, 0.65); animation: goldPulse 2s infinite; }
        .glow-shiny { box-shadow: 0 0 30px rgba(236, 72, 153, 0.75); animation: pinkPulse 2s infinite; }
        .glow-legendary-special { box-shadow: 0 0 40px rgba(234, 179, 8, 0.9), 0 0 80px rgba(255, 215, 0, 0.6); animation: legendaryAura 1.5s infinite; }

        @keyframes goldPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
            50% { box-shadow: 0 0 25px rgba(234, 179, 8, 0.85); }
        }
        @keyframes pinkPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.4); }
            50% { box-shadow: 0 0 25px rgba(236, 72, 153, 0.85); }
        }
        @keyframes legendaryAura {
            0%, 100% { 
                box-shadow: 0 0 40px rgba(234, 179, 8, 0.9), 0 0 80px rgba(255, 215, 0, 0.6), 0 0 120px rgba(255, 255, 255, 0.3);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 60px rgba(234, 179, 8, 1), 0 0 100px rgba(255, 215, 0, 0.8), 0 0 150px rgba(255, 255, 255, 0.5);
                transform: scale(1.05);
            }
        }
        @keyframes legendaryEntry {
            0% { 
                opacity: 0;
                transform: scale(0.5) rotate(-180deg);
                filter: brightness(0);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.2) rotate(10deg);
                filter: brightness(1.5);
            }
            100% { 
                opacity: 1;
                transform: scale(1) rotate(0deg);
                filter: brightness(1);
            }
        }
        .legendary-entry-animation {
            animation: legendaryEntry 1.5s ease-out forwards;
        }

        /* Scanline Overlay for Retro Radar Vibe */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.015), rgba(0, 255, 0, 0.008), rgba(0, 0, 255, 0.015));
            background-size: 100% 4px, 6px 100%;
            z-index: 999;
            pointer-events: none;
            opacity: 0.15;
        }

        /* Loading Spinner */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #f43f5e;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Hide Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090e1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
        /* ===== REAL POKÉBALL STYLES ===== */
        .pokeball-svg { display:flex; align-items:center; justify-content:center; }
        .pokeball-svg svg { filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5)); transition:transform 0.15s ease; }
        .ball-selector-btn:hover .pokeball-svg svg, .ball-selector-btn.active .pokeball-svg svg { transform:scale(1.12) rotate(-12deg); }

        /* ===== LIGHT MODE ===== */
        /* ═══ COMPREHENSIVE LIGHT MODE ═══════════════════════════════════════════ */
        body.light-mode { background-color:#f0f4f8!important; color:#0f172a!important; }
        body.light-mode .scanlines { opacity:0.02!important; }

        /* many styles omitted for brevity — original styles preserved */
    </style>

<body class="min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white pb-16 md:pb-0">

    <!-- EPIC LOADING SCREEN -->

        <!-- Layered glow blobs -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="absolute w-[600px] h-[600px] rounded-full" style="top:-150px;left:-150px;background:radial-gradient(circle,rgba(244,63,94,0.18) 0%,transparent 70%);animation:pulseBlob 4s ease-[...]">
            <div class="absolute w-[500px] h-[500px] rounded-full" style="bottom:-100px;right:-100px;background:radial-gradient(circle,rgba(139,92,246,0.18) 0%,transparent 70%);animation:pulseBlob 5s [...]">
            <div class="absolute w-[400px] h-[400px] rounded-full" style="top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(251,146,60,0.08) 0%,transparent 70%);an[...]">
            <!-- Star field -->
            <div class="load-star" style="top:12%;left:20%;animation-delay:0s;"></div>
            <div class="load-star" style="top:28%;left:72%;animation-delay:0.4s;"></div>

            <div class="load-star" style="top:80%;left:82%;animation-delay:1.2s;"></div>
            <div class="load-star" style="top:45%;left:88%;animation-delay:0.6s;"></div>
            <div class="load-star" style="top:10%;left:55%;animation-delay:1.0s;"></div>
            <div class="load-star" style="top:90%;left:40%;animation-delay:0.2s;"></div>
        </div>

        <div class="relative z-10 flex flex-col items-center px-6 w-full max-w-sm">
            <!-- Giant bouncing Pokéball -->
            <div style="animation:loadBallBounce 1.2s ease-in-out infinite;margin-bottom:2rem;" id="loadBall">
                <svg width="120" height="120" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 8px 32px rgba(244,63,94,0.7)) drop-shadow(0 0 60px rgba(244,63,94,0.45)[...]">

                </svg>
            </div>

            <!-- Title -->
            <div class="text-center mb-1">
                <h1 class="font-black tracking-tight text-transparent bg-clip-text mb-1" style="font-size:2.8rem;line-height:1;background-image:linear-gradient(135deg,#f43f5e 0%,#ec4899 40%,#fb923c 10[...]">
                <h1 class="font-black tracking-widest text-white" style="font-size:1.5rem;line-height:1;letter-spacing:0.35em;text-shadow:0 0 20px rgba(244,63,94,0.6),0 2px 8px rgba(0,0,0,0.8);">SPINN[...]</h1>
            </div>

            <!-- Progress bar — chunky with glow -->
            <div class="w-full mb-3 relative">
                <div class="w-full h-4 rounded-full overflow-hidden" style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);box-shadow:inset 0 2px 4px rgba(0,0,0,0.4);">
                    <div id="loadingBar" class="h-full rounded-full transition-all duration-300 relative" style="width:0%;background:linear-gradient(90deg,#f43f5e,#ec4899,#fb923c);box-shadow:0 0 16px [...]
                        <div class="absolute inset-0 rounded-full" style="background:linear-gradient(to bottom,rgba(255,255,255,0.25),transparent);"></div>
                    </div>
                </div>
            </div>
            <!-- Loading text -->
            <p id="loadingText" class="text-center text-xs font-bold tracking-widest uppercase" style="color:rgba(255,255,255,0.4);">Shuffling Pokémon data...</p>
            <!-- Beta warning -->
            <p class="text-center text-[10px] mt-3 font-bold tracking-wide uppercase" style="color:rgba(255,180,80,0.7);text-shadow:0 0 8px rgba(255,130,0,0.4);">⚠️ Game is in beta — bugs may ex[...]</p>
        </div>
    </div>

    <!-- BATTLE SCREEN (Phase 1) -->
    <section id="battleScreen" aria-hidden="true" class="" style="">
      <div id="battleMap" class="relative mx-auto">
        <img id="battleMapBg" src="assets/maps/battle_map.png" alt="Battle map background" onerror="this.onerror=null;this.src='assets/maps/battle_map.svg'">

        <!-- Opposing Pokemon (center-right) -->
        <div id="opponentWrap">

        <!-- Player Pokemon back sprite (bottom-left) -->
        <div id="playerBackWrap">

        <!-- Moves UI (bottom-right) -->

        <!-- Opponent HUD -->
        <div id="opponentHUD">

    <!-- CUSTOM NOTIFICATION MODAL -->
    <div id="customToast" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 bg-slate-900/95 border-2 border-slate-850 px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-4 transition-opac[...]>

        </div>
        <div>

            <p id="toastMessage" class="text-slate-300 text-xs mt-0.5">Notification description.</p>
